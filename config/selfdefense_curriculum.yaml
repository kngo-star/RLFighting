# Curriculum Learning: Der Gegner wird schrittweise grösser und stärker.
# Start:  mlagents-learn config/selfdefense_curriculum.yaml --run-id=curriculum_v1
behaviors:
  SelfDefense:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 4000000
    time_horizon: 128
    summary_freq: 20000
    checkpoint_interval: 500000

environment_parameters:
  style: -1
  scenario: -1
  strength_ratio: -1
  mass_ratio: -1
  mass_ratio_max:
    curriculum:
      - name: GleichGross
        completion_criteria:
          measure: reward
          behavior: SelfDefense
          signal_smoothing: true
          min_lesson_length: 200
          threshold: 0.4
        value: 1.1
      - name: EtwasGroesser
        completion_criteria:
          measure: reward
          behavior: SelfDefense
          signal_smoothing: true
          min_lesson_length: 200
          threshold: 0.3
        value: 1.4
      - name: VielGroesser
        value: 1.8
